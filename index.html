<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirBNB Listings</title>
    <!--Load bootstrap here-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!--CSS Style-->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body id="top">
    <!--Container is from bootstrap. This make sure the content didn't stretch-->
    <div class="container">
      <header>
        <!--Navigation on top of the page-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
          <div class="container-fluid">
            <a class="navbar-brand" href="#top">Airbnb Listings</a>

            <div class="navbar-nav">
              <a class="nav-link" href="#top">Home</a>
              <a class="nav-link" href="#listings">Listings</a>
            </div>
          </div>
        </nav>
      </header>

      <h1>AirBNB Listings Reloaded!</h1>
      <section>
        <div class="row">
          <div class="col">
            <p>
              Explore Airbnb listings in San Francisco. Use the search box below to
              search listings by name and view information about each property.
            </p>
          </div>
        </div>
      </section>
      <!-- intro -->
      <hr />

      <section>
        <!--Here is the listing of the properties-->
        <h2>Listings</h2>
        <!--Add live search/filter-->
        <div class="mb-3">
          <label for="listing-search" class="form-label">Search Listings</label>
          <input
            type="search"
            id="listing-search"
            class="form-control"
            placeholder="Search by listing name..."
          />
        </div>
        <!--Assign id="listings" so that JavaScript can find this element-->
        <div id="listings" class="row"></div>
      </section>
    </div>
    <!--This is bootstrap Javascript-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <!--My Javascript-->
    <script src="js/main.js"></script>
  </body>
</html>
